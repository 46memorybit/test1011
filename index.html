<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>X 全面表示</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: max(16px, env(safe-area-inset-top)) 20px 16px;
      font-size: 20px;
      font-weight: 800;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
    }

    #openButton {
      width: min(100%, 320px);
      min-height: 100px;
      border: none;
      border-radius: 24px;
      background: #fff;
      color: #000;
      font-size: 30px;
      font-weight: 800;
      cursor: pointer;
    }

    #openButton:active {
      transform: scale(0.97);
    }

    p {
      max-width: 320px;
      color: #aaa;
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
    }

    footer {
      padding: 16px 12px max(16px, env(safe-area-inset-bottom));
      color: #777;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>𝕏 X</header>

  <main>
    <button id="openButton" type="button">全面</button>
    <p>
      ボタンを押すと X を開きます。<br>
      インターネット接続が必要です。
    </p>
  </main>

  <footer>X 全面表示 PWA</footer>

  <script>
    document.getElementById("openButton").addEventListener("click", () => {
      window.location.href = "https://x.com/";
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(console.error);
      });
    }
  </script>
</body>
</html>
