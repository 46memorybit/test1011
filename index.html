
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>X 全面表示</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      min-height: 60px;
      padding: 10px 16px;
      padding-top: max(10px, env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #000;
      border-bottom: 1px solid #292929;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
    }

    button, .external-link {
      border: 0;
      border-radius: 999px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }

    #openButton {
      background: #fff;
      color: #000;
      font-size: 16px;
      padding: 16px 32px;
    }

    #backButton {
      background: #292929;
      color: #fff;
    }

    main {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #home {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      text-align: center;
    }

    #home p {
      color: #aaa;
      line-height: 1.7;
      font-size: 14px;
    }

    #browser {
      display: none;
      position: absolute;
      inset: 0;
      background: #fff;
      flex-direction: column;
    }

    #browser.active {
      display: flex;
    }

    #browserBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: #111;
      flex-shrink: 0;
    }

    #address {
      color: #ddd;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #xFrame {
      width: 100%;
      flex: 1;
      min-height: 0;
      border: 0;
      background: #fff;
    }

    #fallback {
      display: none;
      padding: 20px;
      text-align: center;
      color: #111;
      background: #fff;
      line-height: 1.7;
    }

    #fallback a {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 20px;
      border-radius: 999px;
      color: #fff;
      background: #000;
      text-decoration: none;
      font-weight: 700;
    }

    footer {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      color: #888;
      background: #000;
      font-size: 11px;
    }

    body.fullscreen header,
    body.fullscreen footer {
      display: none;
    }

    body.fullscreen main {
      padding: 0;
    }

    @media (display-mode: standalone) {
      header {
        min-height: 56px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">𝕏 X</div>
    <button id="backButton" type="button" hidden>戻る</button>
  </header>

  <main>
    <section id="home">
      <button id="openButton" type="button">全面</button>
      <p>
        ボタンを押して X を開きます。<br>
        X の仕様によりアプリ内表示が制限される場合があります。
      </p>
    </section>

    <section id="browser" aria-label="アプリ内ブラウザ">
      <div id="browserBar">
        <span id="address">https://x.com/</span>
        <button id="exitButton" type="button">閉じる</button>
      </div>

      <iframe
        id="xFrame"
        title="X"
        src="about:blank"
        referrerpolicy="no-referrer"
        allow="clipboard-read; clipboard-write"
      ></iframe>

      <div id="fallback">
        <strong>X をアプリ内で表示できない場合</strong>
        <p>
          X 側がアプリ内埋め込みを制限している可能性があります。
          下のリンクから X を開いてください。
        </p>
        <a href="https://x.com/" target="_blank" rel="noopener noreferrer">
          X を開く
        </a>
      </div>
    </section>
  </main>

  <footer> X をすばやく開くための PWA </footer>

  <script>
    const home = document.getElementById("home");
    const browser = document.getElementById("browser");
    const frame = document.getElementById("xFrame");
    const backButton = document.getElementById("backButton");
    const openButton = document.getElementById("openButton");
    const exitButton = document.getElementById("exitButton");

    let fullscreen = false;

    function openX() {
      home.style.display = "none";
      browser.classList.add("active");
      backButton.hidden = false;

      // Xの埋め込みが許可されている環境では表示される。
      // X側で拒否される場合、iframe内では表示できない。
      frame.src = "https://x.com/";
    }

    function closeX() {
      browser.classList.remove("active");
      home.style.display = "flex";
      backButton.hidden = true;
      frame.src = "about:blank";

      if (fullscreen) {
        document.body.classList.remove("fullscreen");
        fullscreen = false;
      }
    }

    openButton.addEventListener("click", async () => {
      document.body.classList.add("fullscreen");
      fullscreen = true;
      openX();

      try {
        if (!document.fullscreenElement &&
            document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        // フルスクリーン非対応でもアプリは利用可能
      }
    });

    backButton.addEventListener("click", closeX);
    exitButton.addEventListener("click", closeX);

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement && fullscreen) {
        // OSのフルスクリーン解除時にもアプリの表示は維持する
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(console.error);
      });
    }
  </script>
</body>
</html>
